# TVBox 源维护工具 · 全局配置
# 与 src/tvboxkeeper/config.py 中 DEFAULTS 对应，可按需覆盖

network:
  timeout: 10          # 单次请求超时（秒）
  retries: 2           # 失败重试次数
  concurrency: 8       # 全局并发上限
  max_bytes: 5242880   # 配置文件大小上限（5MB）
  verify_ssl: false    # 社区站点证书链常不完整（TVBox 客户端也不校验）；仅解析 JSON 不执行代码，风险可控
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    - "okhttp/4.10.0"

validate:
  level: L2                  # 默认验证深度：L1 | L2（L3 预留）
  dead_after_failures: 3     # 连续失败 N 次判死
  anti_crawl_grace: 3        # 反爬页判死宽限倍数（3×3=9 次才判死）
  max_probes: 12             # L2 最多探测的子资源数
  probe_timeout: 8           # 子资源探测超时（秒）
  l3:
    sample_sites: 3          # L3 抽测的站点接口数
    timeout: 8               # L3 单次请求超时（秒）

score:
  weights:
    success: 0.5   # 近 10 次检查成功率权重
    subs: 0.3      # 子资源（jar/直播等）探测通过率权重
    richness: 0.2  # 内容丰富度权重

publish:
  min_health: 60           # 进入多仓订阅的健康分门槛
  duocang: output/多仓.json
  report: output/报告.md
  site: output/site/index.html   # 静态看板（GitHub Pages 用）
  diff: output/last_diff.json    # 本轮变化记录，notify 命令读取
  mirror_base: "https://gh-proxy.com/https://raw.githubusercontent.com/zzxw/tvboxkeeper/main/output/mirrors"
  # ↑ 镜像基址：有快照的源在多仓里改用本仓库镜像地址（需仓库为 Public）；
  #   若仓库是 Private 或不想启用镜像，改回 ""

snapshot:
  keep: 10   # 每个源保留的快照份数

discover:
  max_depth: 2          # 多仓递归展开深度
  max_new_per_run: 100  # 单轮 discover 最多登记的新源数

github:
  token_env: GITHUB_TOKEN   # 从哪个环境变量读 token（可选，但强烈建议）
  repo_queries:             # 仓库搜索关键词（无 token 可用，限 10 次/分钟）
    - "tvbox 接口"
    - "tvbox config"
    - "topic:tvbox"
  code_query: '"storeHouse" extension:json'   # 代码搜索（需要 token）
  max_repos_per_run: 30
  max_fetches_per_run: 60
  raw_mirror: "https://gh-proxy.com"   # raw 直连不通时配置加速镜像；Actions 里可留空
  rehunt_days: 7            # 同一仓库 N 天内不重复探测
