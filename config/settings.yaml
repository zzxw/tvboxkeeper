# TVBox 源维护工具 · 全局配置
# 与 src/tvboxkeeper/config.py 中 DEFAULTS 对应，可按需覆盖

network:
  timeout: 10          # 单次请求超时（秒）
  retries: 2           # 失败重试次数
  concurrency: 8       # 全局并发上限
  # 同一主机的并发与最小请求间隔：同一站点源很多时避免打爆（被限流/封 IP）
  per_host_concurrency: 2
  per_host_interval: 0.5   # 秒；0 = 只限并发，不额外等待
  batch_size: 100      # 每批调度的源数（分块体检，避免一次性建上千协程）
  max_bytes: 5242880   # 配置文件大小上限（5MB）
  verify_ssl: true     # 默认校验证书（比全局关掉更安全）
  # ↓ 若某个源因证书链不完整失败，仅对该源降级为不校验并重试一次（不掩盖超时/握手失败）；
  #   设为 false 则一律不校验证书（等同旧行为）
  verify_ssl_fallback: true
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    - "okhttp/4.10.0"

validate:
  level: L2                  # 默认验证深度：L1 | L2（L3 预留）
  dead_after_failures: 3     # 连续失败 N 次判死
  anti_crawl_grace: 3        # 反爬页判死宽限倍数（3×3=9 次才判死）
  slow_ms: 3000              # 延迟 ≥ 该值且体检成功 → slow（降权但仍可发布；0=关闭）
  slow_window: 5             # slow 判定取近 N 次成功延迟的中位数，抑制单次抖动
  run_deadline_min: 90       # 整轮体检时间预算（分钟），超时停止调度剩余源；0=不限
  max_probes: 12             # L2 最多探测的子资源数
  probe_timeout: 8           # 子资源探测超时（秒）
  jar_max_bytes: 20971520    # jar 全量校验 md5 的下载上限（20MB）
  l3:
    sample_sites: 3          # L3 抽测的站点接口数
    timeout: 8               # L3 单次请求超时（秒）
    enabled: true            # 开启每日抽样：真实验证 CMS 接口可用（原先从未触发）
    daily_quota: 5           # 每天抽测几个源（按健康分从高到低）
    min_health: 85           # 只抽测健康分达标的源
  # 增量体检：内容 md5 未变、且离上次真实探测不足 N 天时跳过 L2 子资源探测。
  # jar/直播地址写在配置里，配置没变说明地址没变；但目标仍可能挂掉，故设窗口强制重探。
  incremental:
    enabled: true
    probe_every_days: 3

score:
  weights:
    success: 0.5   # 近 10 次检查成功率权重
    subs: 0.3      # 子资源（jar/直播等）探测通过率权重
    richness: 0.1  # 内容丰富度权重
    l3: 0.1        # L3 站点接口抽测通过率权重（未抽测按满分，不惩罚）

publish:
  min_health: 60           # 进入多仓订阅的健康分门槛
  duocang: output/多仓.json
  report: output/报告.md
  csv: output/榜单.csv           # 源榜单 CSV（UTF-8 BOM，Excel 双击直开）
  stats: output/stats.json       # 结构化跑批统计（JSON）
  site: output/site/index.html   # 静态看板（GitHub Pages 用）
  diff: output/last_diff.json    # 本轮变化记录，notify 命令读取
  live: output/直播.json         # 直播合集配置（可作配置地址导入）
  super_live: output/super_live.txt  # 超级直播列表（频道归一合并、多线路互备）
  # 精简订阅：门槛更高、条数更少，给低配盒子/长辈用，与全量版互不影响
  lite:
    duocang: output/多仓-lite.json
    live: output/直播-lite.json
    min_health: 80
    max_sources: 8
    max_live: 5
  mirror_base: "https://gh-proxy.com/https://raw.githubusercontent.com/zzxw/tvboxkeeper/main/output/mirrors"
  # ↑ 镜像基址：有快照的源在多仓里改用本仓库镜像地址（需仓库为 Public）；
  #   若仓库是 Private 或不想启用镜像，改回 ""

snapshot:
  keep: 10   # 每个源保留的快照份数

livetest:
  concurrency: 6        # 直播线路测活并发（对流服务器保持克制）
  timeout: 6            # 单条超时（秒）
  probe_every_days: 7   # 每条线路 N 天内不重复测
  max_per_run: 1500     # 单轮上限；首轮全覆盖分几天完成
  # 测活结论存库，publish 构建超级直播列表时自动剔除窗口内的死线

notify:
  silent_when_unchanged: true   # 无变化且无新鲜周报时不推送通知渠道

compliance:
  enabled: true        # 体检时扫描敏感关键词，命中自动 banned
  keywords:            # 保守匹配，可按需增删
    - bet365
    - hg0088
    - 太阳城
    - 澳门威尼斯
    - 麻豆传媒
    - 十八禁

cleanup:
  check_log_days: 90  # 体检日志保留天数（过期自动清理 + VACUUM）
  snapshot_days: 90
  origin_days: 90
  live_probe_days: 30

discover:
  max_depth: 2          # 多仓递归展开深度
  max_new_per_run: 100  # 单轮 discover 最多登记的新源数
  max_live_per_run: 50  # 单轮最多登记的直播源数
  min_parent_alive_rate: 0.3  # 父仓历史子源存活率低于该值（样本≥3）本轮不展开

# 网页挖源：抓取指定页面，按正则提取配置地址并登记（默认关闭）
web:
  enabled: false        # 确认 pages 内容可控后再打开
  pages: []             # 待抓取页面，例如 https://example.com/tvbox
  pattern: 'https?://[^\s"''<>]+?\.(?:json|txt|m3u)'  # 候选地址正则
  timeout: 10           # 单页请求超时（秒）
  max_bytes: 2000000    # 单页最多解析的字节数
  max_new_per_run: 20
  depth: 1                 # 0=只扫配置页；1=跟进同域链接一层（跨域不跟）
  max_pages_per_run: 20    # 本轮最多抓取的页面数（含 sitemap 展开）   # 单轮最多登记的新源数

dedupe:
  fingerprint: true        # 二级归并：结构相同但时间戳/顺序不同的镜像也合并

github:
  token_env: GITHUB_TOKEN   # 从哪个环境变量读 token（可选，但强烈建议）
  repo_queries:             # 仓库搜索关键词（无 token 可用，限 10 次/分钟）
    - "tvbox 接口"
    - "tvbox config"
    - "topic:tvbox"
    - "影视仓 接口"          # 偏影视仓生态
    - "影视仓 配置"
  code_query: '"storeHouse" extension:json'   # 代码搜索（需要 token）
  max_repos_per_run: 30
  max_fetches_per_run: 60
  raw_mirror: "https://gh-proxy.com"   # raw 直连不通时配置加速镜像；Actions 里可留空
  rehunt_days: 7            # 同一仓库 N 天内不重复探测
