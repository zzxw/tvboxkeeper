[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvboxkeeper"
version = "0.1.0"
description = "TVBox 源维护工具：发现、体检、评分、发布"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tvboxkeeper = "tvboxkeeper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# 与 requires-python 对齐；CI 固定 3.12 运行，但代码需兼容声明的最低版本
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 保守起步：只开语法错误与 pyflakes 级问题，避免历史代码被批量重构
select = ["E4", "E7", "E9", "F"]
