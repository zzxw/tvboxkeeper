name: daily-check

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 北京时间次日 05:30
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: pip install -e .

      - name: 发现 + 体检 + 发布 + 通知
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 可选：配了才推送 TG
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}     # 可选：飞书机器人
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }} # 可选：钉钉机器人
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}       # 可选：企业微信机器人
        run: |
          tvboxkeeper import
          tvboxkeeper discover
          tvboxkeeper hunt
          tvboxkeeper check
          tvboxkeeper publish
          tvboxkeeper notify

      - name: 提交产物与源库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 每日源体检更新 [skip ci]"
          git push

  pages:
    runs-on: ubuntu-latest
    needs: run
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages 站点必须由仓库管理员一次性开通（Settings → Pages → Source: GitHub Actions）。
      # GITHUB_TOKEN 无权创建站点（enablement 需 PAT/App），故先探测：
      # 未开通或源为分支模式时跳过部署并告警，不影响数据管线判定成功
      - name: 探测 Pages 站点
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "")
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages 未启用::仓库未以 GitHub Actions 作为 Pages 发布源（当前：${build_type:-未创建}），已跳过看板部署。请到 Settings → Pages → Source 选择 GitHub Actions，然后重跑本工作流。"
          fi

      - if: steps.probe.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

      - id: deployment
        if: steps.probe.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
