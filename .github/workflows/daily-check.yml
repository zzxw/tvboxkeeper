name: daily-check

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 北京时间次日 05:30
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: pip install -e .

      - name: 发现 + 体检 + 发布 + 通知
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 可选：配了才推送 TG
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}     # 可选：飞书机器人
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }} # 可选：钉钉机器人
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}       # 可选：企业微信机器人
        run: |
          tvboxkeeper import
          tvboxkeeper discover
          tvboxkeeper hunt
          tvboxkeeper check
          tvboxkeeper publish
          tvboxkeeper notify

      - name: 提交产物与源库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 每日源体检更新 [skip ci]"
          git push

  pages:
    runs-on: ubuntu-latest
    needs: run
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site
      - id: deployment
        uses: actions/deploy-pages@v4
