name: daily-check

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 北京时间次日 05:30
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装（含测试依赖）
        run: pip install -e ".[dev]"

      - name: 静态检查
        run: ruff check src tests

      - name: 测试
        run: pytest -q

  run:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: pip install -e .

      # 源库与快照不进 git：用 Actions cache 跨天持久化（key 每日变化，
      # restore-keys 前缀恢复最近一份；cache 7 天未访问才会被清理）
      - name: 恢复源库缓存
        uses: actions/cache@v4
        with:
          path: data
          key: tvbox-data-${{ github.run_id }}
          restore-keys: tvbox-data-

      - name: 发现 + 体检 + 发布 + 通知
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 可选：配了才推送 TG
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}     # 可选：飞书机器人
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }} # 可选：钉钉机器人
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}       # 可选：企业微信机器人
          BARK_URL: ${{ secrets.BARK_URL }}                         # 可选：Bark 服务地址
          BARK_KEY: ${{ secrets.BARK_KEY }}                         # 可选：Bark 设备 key
        run: |
          tvboxkeeper import
          tvboxkeeper discover
          tvboxkeeper hunt
          tvboxkeeper check
          tvboxkeeper livetest
          tvboxkeeper publish
          tvboxkeeper notify

      - name: 提交产物与源库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交产物与种子清单；data/（源库/快照）走 Actions cache
          git add -A output config/sources.yaml
          git diff --cached --quiet || git commit -m "chore: 每日源体检更新 [skip ci]"
          git push

      - name: 失败告警
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: tvboxkeeper notify --event failed || true

  pages:
    runs-on: ubuntu-latest
    needs: run
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # run job 已把当天产物推送回 main，检出最新 main 才能部署当天看板；
      # 默认检出的是触发提交（昨天的产物），会导致线上看板永远滞后一天
      - uses: actions/checkout@v4
        with:
          ref: main

      # Pages 站点必须由仓库管理员一次性开通（Settings → Pages → Source: GitHub Actions）。
      # GITHUB_TOKEN 无权创建站点（enablement 需 PAT/App），故先探测：
      # 未开通或源为分支模式时跳过部署并告警，不影响数据管线判定成功
      - name: 探测 Pages 站点
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "")
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages 未启用::仓库未以 GitHub Actions 作为 Pages 发布源（当前：${build_type:-未创建}），已跳过看板部署。请到 Settings → Pages → Source 选择 GitHub Actions，然后重跑本工作流。"
          fi

      - if: steps.probe.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

      # 产物上传后索引存在延迟，紧接着部署会偶发
      # "No artifacts named github-pages were found"（产物实际已存在）
      - name: 等待产物可检索
        if: steps.probe.outputs.enabled == 'true'
        run: sleep 15

      - id: deployment
        if: steps.probe.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 部署重试（首次失败时）
        id: deployment_retry
        if: steps.probe.outputs.enabled == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
